sonarr:
  main:
    base_url: http://localhost:8989
    api_key: !secret SONARR_API_KEY

    include:
      # Quality definition applies to all profiles in this instance
      - template: sonarr-quality-definition-anime
      # Standard show profiles
      - template: sonarr-v4-quality-profile-web-1080p
      - template: sonarr-v4-custom-formats-web-1080p
      - template: sonarr-v4-quality-profile-web-2160p
      - template: sonarr-v4-custom-formats-web-2160p
      # Anime profiles (quality definition excluded — anime one covers both)
      - template: sonarr-v4-quality-profile-anime
      - template: sonarr-v4-custom-formats-anime

    quality_profiles:
      # Override WEB-1080p to include Bluray/Remux tiers alongside WEB sources.
      # Profile name kept as-is so TRaSH custom format scoring still targets it.
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-1080p
            qualities:
              - Bluray-1080p Remux
              - Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p

      # Override WEB-2160p similarly, with 1080p tiers as fallback.
      - name: WEB-2160p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-2160p
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
            qualities:
              - Bluray-1080p Remux
              - Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p

      - name: Remux-2160p - Anime
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        min_format_score: 100
        score_set: anime-sonarr
        quality_sort: top
        qualities:
          - name: Bluray-2160p
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: Bluray-1080p
            qualities:
              - Bluray-1080p Remux
              - Bluray-1080p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p

    custom_formats:
      # Block SDR and DV without HDR fallback on the 2160p standard profile
      - trash_ids:
          - 9c38ebb7384dada637be8899efa68e6f # SDR
          - 923b6abef9b17f937fab56cfcf89e1f1 # DV (w/o HDR fallback)
        assign_scores_to:
          - name: WEB-2160p

      # Assign all anime release group tiers to both profiles (scores from TRaSH score_set)
      - trash_ids:
          - 949c16fe0a8147f50ba82cc2df9411c9 # Anime BD Tier 01 (Top SeaDex Muxers)
          - ed7f1e315e000aef424a58517fa48727 # Anime BD Tier 02 (SeaDex Muxers)
          - 096e406c92baa713da4a72d88030b815 # Anime BD Tier 03 (SeaDex Muxers)
          - 30feba9da3030c5ed1e0f7d610bcadc4 # Anime BD Tier 04 (SeaDex Muxers)
          - 545a76b14ddc349b8b185a6344e28b04 # Anime BD Tier 05 (Remuxes)
          - 25d2afecab632b1582eaf03b63055f72 # Anime BD Tier 06 (FanSubs)
          - 0329044e3d9137b08502a9f84a7e58db # Anime BD Tier 07 (P2P/Scene)
          - c81bbfb47fed3d5a3ad027d077f889de # Anime BD Tier 08 (Mini Encodes)
          - e0014372773c8f0e1bef8824f00c7dc4 # Anime Web Tier 01 (Muxers)
          - 19180499de5ef2b84b6ec59aae444696 # Anime Web Tier 02 (Top FanSubs)
          - c27f2ae6a4e82373b0f1da094e2489ad # Anime Web Tier 03 (Official Subs)
          - 4fd5528a3a8024e6b49f9c67053ea5f3 # Anime Web Tier 04 (Official Subs)
          - 29c2a13d091144f63307e4a8ce963a39 # Anime Web Tier 05 (FanSubs)
          - dc262f88d74c651b12e9d90b39f6c753 # Anime Web Tier 06 (FanSubs)
          - e3515e519f3b1360cbfc17651944354c # Anime LQ Groups
          - b4a1b3d705159cdca36d71e57ca86871 # Anime Raws
          - d2d7b8a9d39413da5f44054080e028a3 # v0
          - 273bd326df95955e1b6c26527d1df89b # v1
          - 228b8ee9aa0a609463efca874524a6b8 # v2
          - 0e5833d3af2cc5fa96a0c29cd4477feb # v3
          - 4fc15eeb8f2f9a749f918217d4234ad8 # v4
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
          - 3e0b26604165f463f3e8e192261e7284 # CR
          - 1284d18e693de8efe0fe7d6b3e0b9170 # FUNi
          - 44a8ee6403071dd7b8a3a8dd3fe8cb20 # VRV
          - 89358767a60cc28783cdc3d0be9388a4 # DSNP
          - d34870697c9db575f17700212167be23 # NF
          - d660701077794679fd59e8bdf4ce3a29 # AMZN
          - d54cd2bf1326287275b56bccedb72ee2 # ADN
          - 7dd31f3dee6d2ef8eeaa156e23c3857e # B-Global
          - 4c67ff059210182b59cdd41697b8cb08 # Bilibili
          - 570b03b3145a25011bf073274a407259 # HIDIVE
          - a370d974bc7b80374de1d9ba7519760b # ABEMA
          - 9965a052eb87b0d10313b1cea89eb451 # Remux Tier 01
          - 8a1d0c3d7497e741736761a1da866a2e # Remux Tier 02
        assign_scores_to:
          - name: Remux-2160p - Anime

      # Prefer dual audio (Japanese + English audio tracks in same file)
      - trash_ids:
          - 418f50b10f1907201b6cfdf881f467b7 # Anime Dual Audio
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: 10
          - name: Remux-2160p - Anime
            score: 10

      # Hard-reject: dubs only (no Japanese audio at all)
      - trash_ids:
          - 9c14d194486c4014d422adc64092d794 # Dubs Only
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: -10000
          - name: Remux-2160p - Anime
            score: -10000

      # Hard-reject: French subtitles (VOSTFR = Japanese audio, French subs)
      - trash_ids:
          - 07a32f77690263bb9fda1842db7e273f # VOSTFR
        assign_scores_to:
          - name: Remux-1080p - Anime
            score: -10000
          - name: Remux-2160p - Anime
